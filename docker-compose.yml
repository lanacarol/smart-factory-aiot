
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./infra/postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 15s
      timeout: 10s
      retries: 10

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    ports:
      - "127.0.0.1:8086:8086"
    healthcheck:
      test:
        - CMD
        - influx
        - ping
      interval: 15s
      timeout: 10s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./infra/mosquitto:/mosquitto/config
      - mosquitto_data:/mosquitto/data
    ports:
      - "127.0.0.1:1883:1883"

  simulator:
    build: ./simulator
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD}
      MQTT_GATEWAY_PASSWORD: ${MQTT_GATEWAY_PASSWORD}
    depends_on:
      mosquitto:
        condition: service_started

  mqtt-gateway:
    build: ./services/mqtt_gateway
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_GATEWAY_PASSWORD: ${MQTT_GATEWAY_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_started

  influx-writer:
    build: ./services/influx_writer
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  command-gateway:
    build: ./services/command_gateway
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_GATEWAY_PASSWORD: ${MQTT_GATEWAY_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_started

  api:
    build: ./services/api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      MODEL_DIR: /app/models
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
    volumes:
      - ./ai/models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_started

  # LLM local para o assistente. Sem porta publicada:
  # so a API conversa com ele, pela rede interna.
  ollama:
    image: ollama/ollama:0.6.2
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
    # Limita o LLM para nao travar a VM do Docker:
    # sem limite ele usa todos os nucleos e o Docker
    # Desktop reinicia o motor achando que travou.
    cpus: "6"
    mem_limit: 4g
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 15s
      timeout: 10s
      retries: 10

  ai-inference:
    build: ./services/ai_inference
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      MODEL_DIR: /app/models
    volumes:
      - ./ai/models:/app/models:ro
      # Codigo unico de atributos, o mesmo usado no treino.
      - ./ai/features.py:/app/features.py:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Executa os jobs do Laboratorio de Dados e do Treinamento
  # (filas q.jobs.generate e q.jobs.train). Um job por vez.
  ai-jobs:
    build: ./services/ai_jobs
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      AI_DIR: /app/ai
    volumes:
      - ./ai:/app/ai
    # Limites para o treino nao travar a VM do Docker.
    cpus: "3"
    mem_limit: 3g
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  influxdb_data:
  influxdb_config:
  mosquitto_data:
  ollama_data:
